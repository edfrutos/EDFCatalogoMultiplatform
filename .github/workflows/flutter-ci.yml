name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env placeholder (asset requerido por web/android)
        run: echo "# CI placeholder — variables reales se inyectan en runtime" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  test-e2e:
    # ubuntu-24.04 expone Linux desktop + Chrome — sin -d Flutter aborta por
    # ambigüedad. Chrome no admite integration_test; Linux necesita display.
    # Solución: Xvfb + dependencias GTK + -d linux.
    name: Integration Tests (Linux desktop)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env placeholder
        run: echo "# CI placeholder" > .env

      - name: Install Linux desktop build deps & Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run integration tests (Linux desktop via Xvfb)
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          sleep 3
          flutter test integration_test/ -d linux
        env:
          DISPLAY: ":99"

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test-e2e

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env placeholder
        run: echo "# CI placeholder" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

  build-android:
    name: Build Android (AAB)
    runs-on: ubuntu-latest
    needs: test-e2e

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # PNG icons están en Git LFS — sin esto AAPT2 recibe el puntero de texto

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env placeholder
        run: echo "# CI placeholder" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode \
            > android/app/edfcatalogo-release.jks

      - name: Create key.properties
        env:
          KEYSTORE_B64:     ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD:   ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS:        ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:     ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          cat > android/key.properties << EOF
          storeFile=edfcatalogo-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build Android AAB
        run: flutter build appbundle --release

  deploy-web:
    name: Deploy Web (producción)
    runs-on: ubuntu-latest
    needs: build-web
    # Solo en push a main — no en pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject production .env
        env:
          ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          printf '%s' "$ENV_FILE" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (producción con .env real)
        run: flutter build web --release

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Sync web files al servidor
        run: |
          rsync -az --delete \
            --exclude=".DS_Store" \
            -e "ssh -p 2222 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            build/web/ \
            root@208.76.221.20:/var/www/vhosts/efjdefrutos.com/edfcat.efjdefrutos.com/

      - name: Reiniciar API en servidor
        run: |
          ssh -p 2222 -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@208.76.221.20 \
            "cd /opt/edfcatalogo && git pull --ff-only && docker compose -f docker/docker-compose.prod.yml up -d --build api"
