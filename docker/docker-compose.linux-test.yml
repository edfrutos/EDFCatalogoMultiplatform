services:
  flutter-linux-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.linux-test
    container_name: flutter-linux-test
    volumes:
      # Montar el código del proyecto
      - ..:/app
      # Montar el .env si existe
      - ../.env:/app/.env:ro
      # Para X11 (GUI) - necesario para ejecutar la aplicación
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - FLUTTER_ROOT=/usr/local/flutter
      - LIBGL_ALWAYS_SOFTWARE=1
      - GALLIUM_DRIVER=llvmpipe
      - MESA_GL_VERSION_OVERRIDE=3.3
    working_dir: /app
    stdin_open: true
    tty: true
    ports:
      # Puerto VNC para acceder a la GUI
      - "5900:5900"
      # Puerto OAuth para autenticación de Google Drive
      - "8080:8080"
    # Permisos adicionales
    privileged: false
    # En macOS, necesitamos usar la red por defecto y TCP para X11
    extra_hosts:
      - "host.docker.internal:host-gateway"

