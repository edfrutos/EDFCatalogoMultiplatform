# docker-compose.web.yml — Despliegue de producción Flutter Web + API Dart
#
# Servicios:
#   api  — Servidor Dart/Shelf → MongoDB Atlas + AWS S3 (puerto interno 8080)
#   web  — Flutter Web servido por Caddy (proxea /api/* → api)
#
# Uso rápido (HTTP local en puerto 8080):
#   docker compose -f docker/docker-compose.web.yml up -d
#
# Con dominio propio y HTTPS automático:
#   CADDY_HOST=catalogo.example.com \
#   docker compose -f docker/docker-compose.web.yml up -d
#
# Requisitos:
#   - Archivo .env en la raíz del proyecto con MONGO_URI, MONGO_DB,
#     AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, API_JWT_SECRET
#   - API_BASE_URL en .env apuntando al host externo, ej:
#       API_BASE_URL=https://catalogo.example.com/api
#       (en local: API_BASE_URL=http://localhost:8080/api)

services:

  # ── Servidor API Dart/Shelf ─────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: edfcatalogo-api:latest
    container_name: edfcatalogo-api
    restart: unless-stopped
    # Lee todas las variables del .env directamente como env vars del proceso
    env_file:
      - ../.env
    environment:
      API_PORT: "8080"
      # Permitir únicamente peticiones desde el servicio web (mismo stack)
      API_CORS_ORIGIN: "${API_CORS_ORIGIN:-*}"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Flutter Web con Caddy (sirve estáticos + proxea /api/*) ─────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      # Secreto BuildKit: inyecta .env sin grabarlo en la imagen
      secrets:
        - env_file
    image: edfcatalogo-web:latest
    container_name: edfcatalogo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      CADDY_HOST: "${CADDY_HOST:-:80}"
    volumes:
      - ./Caddyfile.web:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  env_file:
    file: ../.env

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
